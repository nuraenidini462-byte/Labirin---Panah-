<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrow Maze Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-blue">
    <div class="game-container">
        <!-- Header Atas Persis Gambar -->
        <div class="header">
            <div class="level-pill">
                <span class="star-icon">★</span> Level <span id="level-num">1</span>
            </div>
            <div class="lives-pill" id="lives-display">
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
            </div>
        </div>

        <!-- Area Main Canvas Padat -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Footer Control Bar Persis Gambar -->
        <div class="footer-bar">
            <button class="footer-btn btn-palette" id="themeBtn" title="Ganti Tema Warna">🎨</button>
            <button class="footer-btn btn-settings" id="audioBtn" title="Pengaturan Suara">⚙️</button>
            <div class="zoom-slider-container">
                <span class="zoom-icon">—</span>
                <div class="zoom-track">
                    <div class="zoom-thumb"></div>
                </div>
                <span class="zoom-icon">+</span>
            </div>
            <button class="footer-btn btn-menu" id="resetBtn" title="Reset Level">⣿</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
