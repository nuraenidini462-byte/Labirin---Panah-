<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Labirin Panah Ular Rumit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Atas -->
        <div class="header">
            <div class="badge level-badge">⭐ Level <span id="level-num">1</span></div>
            <div class="badge coin-badge">🪙 <span id="coin-count">100</span></div>
            <div class="lives-container" id="lives-display">❤️ ❤️ ❤️</div>
        </div>

        <!-- Area Game Canvas -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Control Bar Bawah (Tampak Jelas) -->
        <div class="footer-controls">
            <button class="icon-btn purple-btn" id="resetBtn" title="Reset Level">
                <span class="btn-icon">🎨</span>
                <span class="btn-text">Reset</span>
            </button>
            <button class="icon-btn green-btn" id="audioBtn" title="Suara">
                <span class="btn-icon">🔊</span>
                <span class="btn-text">Musik</span>
            </button>
            <button class="buy-life-btn" id="buyLifeBtn">
                <span class="btn-icon">➕ ❤️</span>
                <span class="btn-text">(50 🪙)</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
