<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrow Maze Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-blue">
    <div class="game-container">
        <!-- Header Atas: Level, Koin, & Nyawa -->
        <div class="header">
            <div class="level-pill">
                <span class="star-icon">★</span> Level <span id="level-num">1</span>
            </div>
            <div class="coin-pill">
                🪙 <span id="coin-count">100</span>
            </div>
            <div class="lives-pill" id="lives-display">
                ❤️ ❤️ ❤️
            </div>
        </div>

        <!-- Area Canvas Main -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Footer Control Bar -->
        <div class="footer-bar">
            <!-- 1. Palet Ujung Kiri: Ganti Warna Latar -->
            <button class="footer-btn btn-palette" id="themeBtn" title="Ganti Warna Latar">🎨</button>
            
            <!-- 2. Setting Sound/Audio -->
            <button class="footer-btn btn-settings" id="audioBtn" title="Pengaturan Suara">🔊</button>
            
            <!-- 3. Zoom Slider / Indicator -->
            <div class="zoom-slider-container">
                <span class="zoom-icon">—</span>
                <div class="zoom-track">
                    <div class="zoom-thumb"></div>
                </div>
                <span class="zoom-icon">+</span>
            </div>
            
            <!-- 4. Tombol Pembelian Nyawa -->
            <button class="footer-btn btn-buy-life" id="buyLifeBtn" title="Beli Nyawa (50 Koin)">
                <span class="btn-heart-icon">❤️</span>
                <span class="btn-cost-text">+1</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
