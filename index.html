<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrow Maze Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark">
    <div class="game-container">
        <div class="header">
            <div class="header-badge level-badge">
                <span class="star-icon">★</span> Level <span id="level-num">187</span>
            </div>
            
            <div class="header-badge coin-badge">
                <span class="coin-icon">🪙</span> <span id="coin-count">460</span>
            </div>

            <div class="lives-pill" id="lives-display">
                <span class="heart active">❤️</span>
                <span class="heart active">❤️</span>
                <span class="heart active">❤️</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="footer-bar">
            <button class="footer-btn btn-palette" id="openBgBtn" title="Ganti Latar">🎨</button>
            
            <button class="footer-btn btn-settings" id="openSettingsBtn" title="Pengaturan">⚙️</button>
            
            <div class="zoom-slider-container">
                <button class="zoom-btn" id="zoomOutBtn">—</button>
                <div class="zoom-track">
                    <div class="zoom-thumb" id="zoomThumb"></div>
                </div>
                <button class="zoom-btn" id="zoomInBtn">+</button>
            </div>

            <button class="footer-btn btn-add-heart" id="buyLifeBtn" title="Beli Nyawa">
                ❤️<sup>+</sup>
            </button>
        </div>
    </div>

    <div class="modal-overlay hidden" id="bgModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Pilih Warna Latar</h3>
                <button class="close-btn" id="closeBgBtn">✕</button>
            </div>
            <div class="bg-options-grid">
                <button class="bg-opt-btn bg-dark-opt active" data-bg="bg-dark">Malam Gelap</button>
                <button class="bg-opt-btn bg-navy-opt" data-bg="bg-navy">Biru Navy</button>
                <button class="bg-opt-btn bg-light-opt" data-bg="bg-light">Putih Terang</button>
                <button class="bg-opt-btn bg-cream-opt" data-bg="bg-cream">Krem Soft</button>
                <button class="bg-opt-btn bg-green-opt" data-bg="bg-green">Hijau Mint</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="settingsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Pengaturan Suara</h3>
                <button class="close-btn" id="closeSettingsBtn">✕</button>
            </div>
            <div class="setting-item">
                <span>🎵 Musik Latar</span>
                <label class="switch">
                    <input type="checkbox" id="musicToggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>🔔 Efek Suara (SFX)</span>
                <label class="switch">
                    <input type="checkbox" id="sfxToggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>📳 Getaran</span>
                <label class="switch">
                    <input type="checkbox" id="vibrateToggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
            <button class="modal-btn btn-secondary" id="restartLevelBtn">Coba Lagi Level Ini</button>
        </div>
    </div>

    <div class="modal-overlay hidden" id="gameOverModal">
        <div class="modal-card">
            <button class="close-btn" id="closeGameOverBtn">✕</button>
            <div class="modal-header-centered">
                <h3>Nyawa Habis!</h3>
            </div>
            <div class="heart-hero">
                ❤️
                <span class="badge-plus">+3</span>
            </div>
            <p class="modal-subtext">Beli 3 Nyawa Seharga <b>50 Koin</b> untuk Melanjutkan</p>
            <button class="modal-btn btn-primary" id="buyReviveBtn">🪙 Beli Nyawa (50 Koin)</button>
            <button class="btn-text-only" id="giveUpBtn">Ulangi Level</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
