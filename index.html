<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Labirin Panah Ular</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Atas -->
        <div class="header">
            <div class="badge level-badge">⭐ Level <span id="level-num">1</span></div>
            <div class="badge coin-badge">🪙 <span id="coin-count">100</span></div>
            <div class="lives-container" id="lives-display">❤️ ❤️ ❤️</div>
        </div>

        <!-- Area Game Canvas -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Control Bar Bawah -->
        <div class="footer-controls">
            <button class="icon-btn purple-btn" id="resetBtn" title="Reset Level">🎨</button>
            <button class="icon-btn green-btn" id="audioBtn" title="Suara">🔊</button>
            <button class="buy-life-btn" id="buyLifeBtn">➕ ❤️ (50 🪙)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
